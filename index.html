<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Примерочная</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Примерочная">
<meta name="theme-color" content="#F3EAE8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — frosted sticky header, scrolling panel, frosted tab bar; bottom sheets for detail. Powder-room vitrine: each garment sits on a soft pool of light. */
:root{
  --bg:#F3EAE8; --surface:#FBF6F5; --raised:#FFFFFF; --sunk:#ECE0DD; --ink:#2E2126; --muted:#8C7980; --line:rgba(96,52,64,.11);
  --accent:#B06A79; --accent-ink:#FFFFFF; --accent-soft:rgba(176,106,121,.13); --tag:rgba(96,52,64,.07); --good:#5E8C70; --warn:#B4614B;
  --board:#F1E5E2; --glow:rgba(255,255,255,.9); --glass:rgba(243,234,232,.8);
  --shadow-item:rgba(92,44,58,.20); --shadow-ui:rgba(92,44,58,.10);
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:18px; --tabh:68px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.3) blur(18px);backdrop-filter:saturate(1.3) blur(18px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:28px;line-height:1;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-style:normal;font-family:var(--f-label);font-weight:400;font-size:10px;letter-spacing:.14em;margin-top:6px;text-transform:uppercase;color:var(--muted);margin-top:2px}
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px)}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1;letter-spacing:-.005em;margin:0;text-wrap:balance}
.label{font-family:var(--f-label);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* buttons */
.btn{transition:transform .18s var(--ease),background .25s,border-color .25s,opacity .2s;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px rgba(176,106,121,.28)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{transition:transform .18s var(--ease),background .25s;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{transition:transform .18s var(--ease),background .25s,color .25s,border-color .25s;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:active:not(:disabled),.icon-btn:active,.chip:active,.sw:active,.lock:active{transform:scale(.94)}
.chip .n{font-family:var(--f-label);font-weight:400;opacity:.65;margin-left:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{transition:background .3s var(--ease),color .3s;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 2px 8px var(--shadow-ui)}

.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-weight:700}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{box-shadow:0 1px 2px var(--shadow-ui);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:inherit}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat .k{margin-top:6px}
.stat .k{font-family:var(--f-label);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* hang-tag item card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tagcard{box-shadow:0 1px 2px var(--shadow-ui),0 8px 24px var(--shadow-ui);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0;transition:transform .35s var(--ease),border-color .3s}
.tagcard:active{transform:scale(.97)}
.tagcard .ph{position:relative;aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;
  background:radial-gradient(62% 48% at 50% 44%,var(--glow),transparent 72%),linear-gradient(180deg,#F6ECEA,var(--surface) 92%)}
.tagcard .ph::after{content:"";position:absolute;left:22%;right:22%;bottom:9%;height:14px;border-radius:50%;background:radial-gradient(closest-side,var(--shadow-item),transparent);pointer-events:none}
.tagcard .ph img{position:relative;z-index:1;max-width:76%;max-height:78%;object-fit:contain;filter:drop-shadow(0 14px 16px var(--shadow-item));transition:transform .6s var(--ease)}
@media (hover:hover){.tagcard:hover{border-color:rgba(176,106,121,.35)}.tagcard:hover .ph img{transform:translateY(-5px) scale(1.035)}}
.tagcard .nm{padding:12px 14px 0;font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tagcard .meta{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:8px 14px 14px}
.tagcard .meta .label{font-size:10px}
.dots{display:flex;gap:3px}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(46,33,38,.2)}
.wear{font-family:var(--f-label);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{position:absolute;z-index:2;top:10px;left:10px;font-family:var(--f-label);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--muted);padding:2px 6px;border-radius:6px}

.empty{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* builder rows */
.brow{display:flex;flex-direction:column;gap:6px}
.brow .spread .label{font-size:11px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 4px 20px;margin-bottom:-16px;border-radius:var(--r)}
.strip::-webkit-scrollbar{display:none}
.slot{flex:0 0 42%;max-width:220px;aspect-ratio:1/1;background:radial-gradient(60% 50% at 50% 45%,var(--glow),transparent 72%),var(--surface);border-radius:var(--r);scroll-snap-align:center;display:grid;place-items:center;border:1px solid var(--line);position:relative;transform:scale(.92);opacity:.5;transition:transform .45s var(--ease),opacity .45s var(--ease),border-color .3s}
.slot img{max-width:80%;max-height:80%;object-fit:contain;filter:drop-shadow(0 10px 12px var(--shadow-item))}
.slot.on{box-shadow:0 8px 22px var(--shadow-ui);border-color:rgba(176,106,121,.55);transform:none;opacity:1}
.shuf .slot.on img{animation:pop .55s var(--spring) both}
.slot.none{color:var(--muted);font-family:var(--f-label);font-size:12px}
.lock{transition:transform .18s var(--ease),background .25s;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center}
.lock[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lock svg{width:15px;height:15px}

/* collage board */
.board{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--board);touch-action:none;user-select:none;-webkit-user-select:none}
.board .pc{position:absolute;transform-origin:center;touch-action:none}
.board .pc img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 10px 14px var(--shadow-item))}
.board.mini .pc img{filter:drop-shadow(0 4px 5px var(--shadow-item))}
.board{isolation:isolate;box-shadow:inset 0 0 0 1px var(--line)}
.board.edit .pc.sel{outline:1.5px dashed var(--accent);outline-offset:4px}
.board.mini{border-radius:10px}
.board.mini .pc img{filter:none}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:420px){.ogrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ocard{box-shadow:0 1px 2px var(--shadow-ui),0 8px 24px var(--shadow-ui);background:var(--surface);border-radius:var(--r);padding:8px;border:1px solid var(--line);transition:transform .35s var(--ease);text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.ocard .nm{font-weight:600;font-size:14px;padding:0 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--f-label);font-size:10.5px;text-align:center;color:var(--muted);padding:4px 0}
.day{aspect-ratio:3/4;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;position:relative;overflow:hidden}
.day .d{font-family:var(--f-label);font-size:11px;text-align:left;padding-left:2px;font-variant-numeric:tabular-nums}
.day.out{background:transparent;opacity:.35}
.day.today .d{color:var(--accent);font-weight:500}
.day.today{border-color:var(--accent);box-shadow:0 4px 16px rgba(176,106,121,.22)}
.day .th{flex:1;min-height:0;display:grid;place-items:center}
.day .th img{max-width:100%;max-height:100%;object-fit:contain}
.day .wornmark{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--good)}

/* trips */
.trip{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check img{width:48px;height:48px;object-fit:contain;background:radial-gradient(var(--glow),transparent 70%),var(--board);border-radius:8px;flex:none}
.check input{width:20px;height:20px;accent-color:var(--good);flex:none}
.check .t{flex:1;min-width:0}
.check.done .t{text-decoration:line-through;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px;white-space:normal}
.msg.ai .why{font-size:13px;color:var(--muted);padding:0 4px}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-block:8px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--raised);border-radius:20px;padding:10px 14px;min-height:44px;max-height:140px}

/* inspiration */
.inspo{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.inspo::-webkit-scrollbar{display:none}
.inspo button{flex:0 0 92px;height:128px;border-radius:14px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--sunk);transition:transform .2s var(--ease)}
.inspo button:active{transform:scale(.95)}
.inspo img{width:100%;height:100%;object-fit:cover;display:block}
.stylecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px var(--shadow-ui)}
.stylecard p{margin:0}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.pal span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--tag)}
.pal i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(46,33,38,.18)}
.msg.me img{display:block;width:120px;border-radius:10px;margin-bottom:6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--glass);-webkit-backdrop-filter:saturate(1.3) blur(20px);backdrop-filter:saturate(1.3) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{position:relative;max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs .ind{position:absolute;top:0;left:0;width:25%;height:100%;display:grid;place-items:center;pointer-events:none;transform:translateX(calc(var(--t,0) * 100%));transition:transform .5s var(--spring)}
nav.tabs .ind::before{content:"";width:64px;height:46px;border-radius:16px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(176,106,121,.18)}
nav.tabs button{position:relative;z-index:1;transition:color .3s;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(60,30,40,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .3s var(--ease) both;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{animation:sheetUp .5s var(--ease) both;box-shadow:0 -20px 60px rgba(60,30,40,.18);background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0;flex:none}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h2{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{transition:border-color .2s;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 12px;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{transition:transform .18s var(--ease);width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(46,33,38,.16);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--bg)}
.preview{background:var(--board);border-radius:var(--r);display:grid;place-items:center;height:min(78vw,360px);max-width:100%;overflow:hidden;
  background-image:linear-gradient(45deg,var(--sunk) 25%,transparent 25%),linear-gradient(-45deg,var(--sunk) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--sunk) 75%),linear-gradient(-45deg,transparent 75%,var(--sunk) 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img,.preview canvas{width:auto;height:auto;max-width:92%;max-height:calc(min(78vw,360px) * .9);object-fit:contain}
input[type=range]{width:100%;accent-color:var(--accent)}
.toast{animation:toastIn .45s var(--spring) both;border:1px solid var(--line);box-shadow:0 12px 30px var(--shadow-ui);position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pick button{transition:transform .18s var(--ease),border-color .2s;background:radial-gradient(60% 50% at 50% 45%,var(--glow),transparent 72%),var(--surface);border:1px solid var(--line);border-radius:12px;aspect-ratio:1/1;padding:6px;display:grid;place-items:center;min-width:0}
.pick button img{max-width:100%;max-height:100%;object-fit:contain}
.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pick button:active{transform:scale(.95)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.82)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.enter .tagcard,.enter .ocard,.enter .stat,.enter .trip,.enter .brow,.enter .day,.enter .banner,.enter .empty,.enter .chips,.enter .field,.enter .seg{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
.sheet .board:not(.edit) .pc img,.enter .board .pc img,.shuf .board .pc img{animation:pop .55s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 120ms)}
.msg:last-child{animation:rise .45s var(--ease) both}
.scrim.out{animation:fadeOut .25s ease-in forwards}.scrim.out .sheet{animation:sheetDown .28s cubic-bezier(.5,0,.75,0) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.spinner{animation-duration:3s!important}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<header class="top"><div class="wrap">

function localBackend(){
  let dbp=null;const subs={};const mem={items:[],outfits:[],plans:[],trips:[]};
  try{dbp=new Promise((res,rej)=>{const r=indexedDB.open("primerochnaya",1);r.onupgradeneeded=()=>COLS.forEach(n=>r.result.createObjectStore(n,{keyPath:"id"}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch{dbp=Promise.reject()}
  const tx=(name,mode,fn)=>dbp.then(db=>new Promise((res,rej)=>{const t=db.transaction(name,mode);const st=t.objectStore(name);const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  const emit=n=>subs[n]&&subs[n](mem[n].slice());
  return {kind:"local",
    subscribe(name,cb){subs[name]=cb;tx(name,"readonly",st=>st.getAll()).then(r=>{mem[name]=r||[];emit(name)}).catch(()=>emit(name));return()=>{}},
    put(name,o){const i=mem[name].findIndex(x=>x.id===o.id);if(i>=0)mem[name][i]=o;else mem[name].push(o);emit(name);return tx(name,"readwrite",st=>st.put(o)).catch(()=>{})},
    del(name,id){mem[name]=mem[name].filter(x=>x.id!==id);emit(name);return tx(name,"readwrite",st=>st.delete(id)).catch(()=>{})},
    async saveImage(blob){return{img:await blobToDataURL(blob)}},
    async dropImage(){}
  };
}
function upsert(name,o){const a=S[name];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)}
async function save(name,o){
  if(!backend){toast("Хранилище ещё подключается");return false}
  upsert(name,o);render();
  try{await backend.put(name,o);return true}catch(e){toast("Не сохранилось: "+(e&&e.message||"ошибка"));return false}
}
async function remove(name,id){S[name]=S[name].filter(x=>x.id!==id);render();try{await backend.del(name,id)}catch(e){toast("Не удалилось: "+(e&&e.message||"ошибка"))}}

function parseJSON(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw{code:"invalid_json",message:t};return JSON.parse(t.slice(a,b+1))}
async function callClaude(input,opts={}){
  const key=(lsGet("pr.key","")||"").trim();if(!key)throw{code:"no_key"};
  const msgs=(typeof input==="string"?[{role:"user",content:input}]:input).map(m=>({role:m.role,content:m.content}));
  if((opts.images&&opts.images.length)||(opts.imageUrls&&opts.imageUrls.length)){const last=msgs[msgs.length-1];const parts=[];
    for(const b of opts.images||[]){const d=await blobToDataURL(b);parts.push({type:"image",source:{type:"base64",media_type:(b.type||"image/jpeg"),data:d.split(",")[1]}})}
    for(const u of opts.imageUrls||[])parts.push({type:"image",source:{type:"url",url:u}});
    parts.push({type:"text",text:last.content});last.content=parts}
  let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:opts.modelTier==="quick"?"claude-haiku-5-5":"claude-sonnet-5-5",max_tokens:2000,messages:msgs})})}catch(e){throw{code:"offline"}}
  if(!r.ok){let m="";try{m=(await r.json()).error?.message||""}catch{}throw{code:r.status===401?"bad_key":r.status===429?"rate_limited":/credit/i.test(m)?"no_credit":"upstream_error",message:m}}
  const j=await r.json();return parseJSON((j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join(""));
}
function refreshAI(){const k=lsGet("pr.key","");sampleFn=k?{json:callClaude,urls:true}:null;sampleImages=!!k}

const CAT_EN={top:"top",bottom:"pair of trousers, jeans or skirt",dress:"dress",outer:"coat or jacket",shoes:"pair of shoes",bag:"bag",acc:"accessory"};
function studioPrompt(cat,bg){return `Turn this photo into a clean e-commerce product photo of the same ${CAT_EN[cat]||"piece of clothing"}. Show the item alone, front view, neatly smoothed and shaped as an invisible-mannequin packshot (shoes in a three-quarter side view), centered, filling about 80% of the square frame with even margins. Keep the exact same colour, fabric texture, pattern, print, stitching, buttons, hardware, logos and proportions as in the original photo. Soft, even studio light from above with a faint natural contact shadow. Seamless plain flat ${bg} background with no gradient or texture. Square 1:1 format.`}
async function listImageModels(key){
  let r;try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",{headers:{"x-goog-api-key":key}})}catch{throw new Error("Нет интернета.")}
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(r.status===400||r.status===403?"Google не принял ключ: "+((j.error&&j.error.message)||r.status):"Google ответил ошибкой "+r.status+((j.error&&j.error.message)?": "+j.error.message:""));
  const ms=(j.models||[]).filter(m=>/image/i.test(m.name)&&!/imagen/i.test(m.name)&&(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
  const score=n=>(/flash/.test(n)?100:0)+(/preview|exp/.test(n)?-5:0)+parseFloat((n.match(/(\d+(?:\.\d+)?)/)||[0,0])[1])*10;
  return ms.sort((a,b)=>score(b)-score(a));
}
async function pickModel(key,force){
  let m=lsGet("pr.gmodel","");if(m&&!force)return m;
  const list=await listImageModels(key);if(!list.length)throw new Error("Для этого ключа Google не даёт ни одной модели, которая рисует картинки.");
  const bad=lsGet("pr.gbad",[]);const ok=list.filter(x=>!bad.includes(x));lsSet("pr.gmodels",ok.length?ok:list);m=(ok.length?ok:list)[0];lsSet("pr.gmodel",m);return m;
}
async function studioGen(srcCanvas,cat,retried){
  const key=(lsGet("pr.gkey","")||"").trim();if(!key)throw new Error("Добавь ключ Google AI Studio в настройках.");
  const model=await pickModel(key);
  const k=Math.min(1,1024/Math.max(srcCanvas.width,srcCanvas.height));const c=document.createElement("canvas");c.width=Math.round(srcCanvas.width*k);c.height=Math.round(srcCanvas.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(srcCanvas,0,0,c.width,c.height);
  const b64=c.toDataURL("image/jpeg",.9).split(",")[1];
  // light garments get a dark backdrop so the cut-out keeps their edges
  let lum=0,n=0;try{const q=cutout(srcCanvas,45).canvas,dd=q.getContext("2d").getImageData(0,0,q.width,q.height).data;for(let i=0;i<dd.length;i+=32){if(dd[i+3]>200){lum+=.3*dd[i]+.59*dd[i+1]+.11*dd[i+2];n++}}}catch{}

  box.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{b.idx[x.dataset.pick]=+x.dataset.i;b.none[x.dataset.pick]=false;render()});

  // keep the selected card in view

/* ---------- collage editor ---------- */
function openCollage(o){
  if(!o.layout||!Object.keys(o.layout).length&&o.itemIds.length)o.layout=autoLayout(o.itemIds);
  let sel=null;
  openSheet(`${hd(o.id?"Коллаж: "+esc(o.name):"Новый коллаж")}<div id="cb"></div>
    <div id="ctl" class="field"></div>
    <div class="field"><span class="label">Фон</span><div class="swatches" id="cbg">${BOARD_BG.map(c=>`<button class="sw" data-c="${c}" aria-label="Фон" style="background:${c}" aria-pressed="${o.bg===c}"></button>`).join("")}</div></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="cadd">Добавить вещь</button><button class="btn primary" id="csave">${o.id?"Сохранить":"Сохранить образ"}</button></div>`,sh=>{
    const cb=sh.querySelector("#cb"),ctl=sh.querySelector("#ctl");
    const draw=()=>{cb.innerHTML=boardHTML(o,"edit");const bd=cb.firstElementChild;
      bd.querySelectorAll(".pc").forEach(pc=>{if(pc.dataset.id===sel)pc.classList.add("sel");bind(pc,bd)});
      bd.addEventListener("pointerdown",e=>{if(e.target===bd){sel=null;draw()}});controls()};
    const controls=()=>{const p=sel&&o.layout[sel];if(!p){ctl.innerHTML=`<span class="muted" style="font-size:13px">Нажми на вещь, чтобы двигать, менять размер и слой.</span>`;return}
      ctl.innerHTML=`<div class="spread"><span class="label">${esc(itemById(sel)?.name||"")}</span><div class="row"><button class="btn sm" id="zUp">Вперёд</button><button class="btn sm" id="zDn">Назад</button><button class="btn sm danger" id="rm">Убрать</button></div></div>
        <label class="label" for="szR">Размер</label><input type="range" id="szR" min="10" max="95" value="${p.w}"><label class="label" for="rtR">Поворот</label><input type="range" id="rtR" min="-45" max="45" value="${p.r||0}">`;
      const pcEl=()=>cb.querySelector(`.pc[data-id="${CSS.escape(sel)}"]`);
      ctl.querySelector("#szR").oninput=e=>{p.w=+e.target.value;pcEl().style.width=p.w+"%"};
      ctl.querySelector("#rtR").oninput=e=>{p.r=+e.target.value;pcEl().style.transform=`rotate(${p.r}deg)`};
      const zs=()=>Object.values(o.layout).map(q=>q.z||0);
      ctl.querySelector("#zUp").onclick=()=>{p.z=Math.max(...zs())+1;draw()};
      ctl.querySelector("#zDn").onclick=()=>{p.z=Math.min(...zs())-1;draw()};
      ctl.querySelector("#rm").onclick=()=>{o.itemIds=o.itemIds.filter(i=>i!==sel);delete o.layout[sel];sel=null;draw()}};
    const bind=(pc,bd)=>{let start=null;
      pc.addEventListener("pointerdown",e=>{e.stopPropagation();if(sel!==pc.dataset.id){sel=pc.dataset.id;bd.querySelectorAll(".pc").forEach(x=>x.classList.toggle("sel",x===pc));controls()}
        const p=o.layout[sel];start={x:e.clientX,y:e.clientY,px:p.x,py:p.y,rect:bd.getBoundingClientRect()};pc.setPointerCapture(e.pointerId)});
      pc.addEventListener("pointermove",e=>{if(!start)return;const p=o.layout[pc.dataset.id];
        p.x=Math.max(-20,Math.min(95,start.px+(e.clientX-start.x)/start.rect.width*100));p.y=Math.max(-20,Math.min(95,start.py+(e.clientY-start.y)/start.rect.height*100));
        pc.style.left=p.x+"%";pc.style.top=p.y+"%"});
      const end=()=>{start=null};pc.addEventListener("pointerup",end);pc.addEventListener("pointercancel",end)};
    draw();
    sh.querySelector("#cbg").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;o.bg=b.dataset.c;sh.querySelectorAll("#cbg .sw").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===o.bg));draw()};
    sh.querySelector("#cadd").onclick=()=>{
      const wrap=document.createElement("div");wrap.className="field";
      wrap.innerHTML=`<span class="label">Выбери вещи</span><div class="pick">${V().items.filter(i=>!o.itemIds.includes(i.id)).map(i=>`<button data-add="${esc(i.id)}" aria-label="${esc(i.name)}"><img src="${esc(imgSrc(i))}" alt=""></button>`).join("")||`<span class="muted">Все вещи уже на доске.</span>`}</div>`;
      sh.querySelector("#cadd").replaceWith(wrap);
      wrap.onclick=e=>{const b=e.target.closest("[data-add]");if(!b)return;const id=b.dataset.add;o.itemIds.push(id);const L=autoLayout([id]);o.layout[id]={...L[id],z:Math.max(0,...Object.values(o.layout).map(q=>q.z||0))+1};b.remove();sel=id;draw()}};
    sh.querySelector("#csave").onclick=()=>{if(guardDemo())return;if(o.itemIds.length<1)return toast("Добавь хотя бы одну вещь");
      const done=(name,tags)=>save("outfits",{...o,id:o.id||uid(),name,tags,createdAt:o.createdAt||Date.now()}).then(ok=>{if(ok){toast("Образ сохранён");S.looksSeg="saved";render()}});
      if(o.id){done(o.name,o.tags||[]);closeSheet()}else askName("Новый образ","",done)};
  });
}

function renderPlan(){

function firstImg(o){if(!o)return"";const it=o.itemIds.map(itemById).find(i=>i&&(i.cat==="dress"||i.cat==="top"))||itemById(o.itemIds[0]);return it?imgSrc(it):""}
function renderCal(box){

  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));

  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const p=plans[k];const o=p&&outfitById(p.outfitId);
    if(i>=35&&d.getMonth()!==m)break;
    cells+=`<button class="day ${d.getMonth()!==m?"out":""} ${k===tdy?"today":""}" data-day="${k}" aria-label="${fmtDay(k)}${o?": "+esc(o.name):""}"><span class="d">${d.getDate()}</span>${p&&p.worn?`<span class="wornmark" title="надето"></span>`:""}<span class="th">${o?`<img src="${esc(firstImg(o))}" alt="">`:""}</span></button>`}
  const monthPlans=V().plans.filter(p=>p.id.startsWith(`${y}-${pad(m+1)}`));const wornP=monthPlans.filter(p=>p.worn);
  const freq={};wornP.forEach(p=>{const o=outfitById(p.outfitId);o&&o.itemIds.forEach(i=>freq[i]=(freq[i]||0)+1)});
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const tp=plans[tdy],to=tp&&outfitById(tp.outfitId);
  box.innerHTML=`<div class="banner" style="border-style:solid;background:var(--surface);border-color:var(--line)">${to?`<span><span class="label">Сегодня</span><br><b>${esc(to.name)}</b>${tp.worn?" · надето":""}</span><button class="btn sm ${tp.worn?"":"primary"}" id="todayB">${tp.worn?"Открыть":"Надела"}</button>`:`<span><span class="label">Сегодня</span><br>Образ не выбран</span><button class="btn sm primary" id="todayB">Выбрать</button>`}</div>
    <div class="spread"><button class="icon-btn" id="pm" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><h2 style="text-transform:capitalize">${MONTHS[m]} ${y}</h2><button class="icon-btn" id="nm" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="cal">${["пн","вт","ср","чт","пт","сб","вс"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="stats"><div class="stat"><div class="v">${monthPlans.length}</div><div class="k">в плане</div></div><div class="stat"><div class="v">${wornP.length}</div><div class="k">надето</div></div><div class="stat"><div class="v">${Object.keys(freq).length}</div><div class="k">вещей в ходу</div></div></div>
    ${top.length?`<div class="field"><span class="label">Чаще всего в этом месяце</span><div class="pick">${top.map(([id,n])=>{const it=itemById(id);return it?`<button data-item="${esc(id)}" aria-label="${esc(it.name)}, ${n}" style="position:relative"><img src="${esc(imgSrc(it))}" alt=""><span class="wear" style="position:absolute;right:6px;bottom:4px">×${n}</span></button>`:""}).join("")}</div></div>`:""}`;
  box.querySelector("#pm").onclick=()=>{S.month=m?{y,m:m-1}:{y:y-1,m:11};S.anim=true;render()};
  box.querySelector("#nm").onclick=()=>{S.month=m<11?{y,m:m+1}:{y:y+1,m:0};S.anim=true;render()};
  box.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));

  box.querySelector("#todayB").onclick=()=>{if(to&&!tp.worn){if(guardDemo())return;setWorn(tp,true)}else openDay(tdy)};
}
function setWorn(p,on){
  const o=outfitById(p.outfitId);if(!o||!!p.worn===on)return;
  o.itemIds.forEach(id=>{const it=S.items.find(i=>i.id===id);if(!it)return;
    const wc=Math.max(0,(it.wearCount||0)+(on?1:-1));let lw=it.lastWorn;
    if(on){if(!lw||p.id>lw)lw=p.id}else{const others=S.plans.filter(q=>q.worn&&q.id!==p.id&&outfitById(q.outfitId)?.itemIds.includes(id)).map(q=>q.id).sort();lw=others.pop()||null}
    save("items",{...it,wearCount:wc,lastWorn:lw})});
  save("plans",{...p,worn:on});toast(on?"Отмечено: надето":"Отметка снята");
}

    sh.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{chosen=b.dataset.o;sh.querySelectorAll("[data-o]").forEach(x=>x.style.boxShadow=x===b?"0 0 0 2px var(--accent)":"")});
    const wc=sh.querySelector("#wornC");if(wc)wc.onchange=e=>{if(guardDemo()){e.target.checked=!e.target.checked;return}setWorn(S.plans.find(x=>x.id===k),e.target.checked)};
    sh.querySelector("#dsave").onclick=()=>{if(guardDemo())return;const note=sh.querySelector("#dnote").value.trim();const cur=S.plans.find(x=>x.id===k);
      if(!chosen&&!note){closeSheet();return}
      if(cur&&cur.worn&&cur.outfitId!==chosen)setWorn(cur,false);
      const fresh=S.plans.find(x=>x.id===k)||{};save("plans",{...fresh,id:k,outfitId:chosen,note,worn:fresh.outfitId===chosen?!!fresh.worn:false});closeSheet()};
    const clr=sh.querySelector("#dclr");if(clr)clr.onclick=()=>{if(guardDemo())return;const cur=S.plans.find(x=>x.id===k);if(cur&&cur.worn)setWorn(cur,false);remove("plans",k);closeSheet()};
  });
}
function tripItems(t){const ids=new Set(t.extraItemIds||[]);(t.outfitIds||[]).forEach(oid=>{const o=outfitById(oid);o&&o.itemIds.forEach(i=>ids.add(i))});return[...ids].map(itemById).filter(Boolean)}
function renderTrips(box){
  const {trips}=V();
  box.innerHTML=`<div class="spread"><span class="muted" style="font-size:14px">Выбери образы на поездку — список вещей соберётся сам, без дублей.</span><button class="btn primary sm" id="ntrip">Новая поездка</button></div>
    ${trips.length?trips.map(t=>{const its=tripItems(t);const done=its.filter(i=>t.packed?.[i.id]).length;return`<button class="trip" data-trip="${esc(t.id)}"><div class="spread"><h2>${esc(t.name)}</h2><span class="wear">${done}/${its.length}</span></div>${t.start?`<span class="label">${fmtDay(t.start)}${t.end?" — "+fmtDay(t.end):""}</span>`:""}<div class="bar"><i style="width:${its.length?done/its.length*100:0}%"></i></div><span class="muted" style="font-size:13px">${(t.outfitIds||[]).length} ${plural((t.outfitIds||[]).length,"образ","образа","образов")} · ${its.length} ${plural(its.length,"вещь","вещи","вещей")}</span></button>`}).join("")
    :`<div class="empty"><h2>Поездок пока нет</h2><span class="muted">Создай поездку и отметь образы, которые возьмёшь.</span></div>`}`;
  box.querySelector("#ntrip").onclick=()=>{if(guardDemo())return;editTrip({id:uid(),name:"",start:"",end:"",outfitIds:[],extraItemIds:[],packed:{}},true)};
  box.querySelectorAll("[data-trip]").forEach(b=>b.onclick=()=>openTrip(b.dataset.trip));
}
function editTrip(t,isNew){
  openSheet(`${hd(isNew?"Новая поездка":"Поездка")}
    <div class="field"><label class="label" for="tn">Куда</label><input type="text" id="tn" value="${esc(t.name)}" placeholder="Львов на выходные"></div>
    <div class="row"><div class="field" style="flex:1;min-width:130px"><label class="label" for="ts">С</label><input type="date" id="ts" value="${esc(t.start)}"></div><div class="field" style="flex:1;min-width:130px"><label class="label" for="te">По</label><input type="date" id="te" value="${esc(t.end)}"></div></div>
    <div class="field"><span class="label">Образы</span>${V().outfits.length?`<div class="ogrid">${V().outfits.map(o=>`<button class="ocard" data-o="${esc(o.id)}" aria-pressed="${t.outfitIds.includes(o.id)}" style="${t.outfitIds.includes(o.id)?"box-shadow:0 0 0 2px var(--accent)":""}">${boardHTML(o,"mini")}<span class="nm">${esc(o.name)}</span></button>`).join("")}</div>`:`<span class="muted">Сохранённых образов нет — можно добавить отдельные вещи ниже.</span>`}</div>
    <div class="field"><span class="label">Отдельные вещи</span><div class="pick">${V().items.map(i=>`<button data-x="${esc(i.id)}" aria-pressed="${(t.extraItemIds||[]).includes(i.id)}" aria-label="${esc(i.name)}"><img src="${esc(imgSrc(i))}" alt=""></button>`).join("")}</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="tsave">Сохранить</button></div>`,sh=>{
    sh.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const id=b.dataset.o;t.outfitIds=t.outfitIds.includes(id)?t.outfitIds.filter(x=>x!==id):[...t.outfitIds,id];const on=t.outfitIds.includes(id);b.setAttribute("aria-pressed",on);b.style.boxShadow=on?"0 0 0 2px var(--accent)":""});
    sh.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const id=b.dataset.x;t.extraItemIds=(t.extraItemIds||[]).includes(id)?t.extraItemIds.filter(x=>x!==id):[...(t.extraItemIds||[]),id];b.setAttribute("aria-pressed",t.extraItemIds.includes(id))});
    sh.querySelector("#tsave").onclick=()=>{t.name=sh.querySelector("#tn").value.trim()||"Поездка";t.start=sh.querySelector("#ts").value;t.end=sh.querySelector("#te").value;save("trips",t);closeSheet();openTrip(t.id)};
  });
}
function openTrip(id){
  const t=V().trips.find(x=>x.id===id);if(!t)return;const its=tripItems(t);
  const groups=CATS.map(c=>({c,list:its.filter(i=>i.cat===c.k)})).filter(g=>g.list.length);
  const done=its.filter(i=>t.packed?.[i.id]).length;
  openSheet(`${hd(esc(t.name))}${t.start?`<span class="label">${fmtDay(t.start)}${t.end?" — "+fmtDay(t.end):""}</span>`:""}
    <div class="spread"><span><b id="tcnt">${done}</b> из ${its.length} упаковано</span><span class="row"><button class="btn sm" id="tedit">Изменить</button><button class="btn sm danger ghost" id="tdel">Удалить</button></span></div>
    <div class="bar"><i id="tbar" style="width:${its.length?done/its.length*100:0}%"></i></div>
    ${groups.map(g=>`<div class="field"><span class="label">${g.c.n}</span>${g.list.map(i=>`<label class="check ${t.packed?.[i.id]?"done":""}"><input type="checkbox" data-pk="${esc(i.id)}" ${t.packed?.[i.id]?"checked":""}><img src="${esc(imgSrc(i))}" alt=""><span class="t">${esc(i.name)}</span></label>`).join("")}</div>`).join("")||`<span class="muted">В поездке пока нет вещей.</span>`}`,sh=>{
    sh.querySelectorAll("[data-pk]").forEach(c=>c.onchange=e=>{if(guardDemo()){e.target.checked=!e.target.checked;return}
      const cur=S.trips.find(x=>x.id===id);const packed={...(cur.packed||{}),[c.dataset.pk]:e.target.checked};save("trips",{...cur,packed});
      c.closest(".check").classList.toggle("done",e.target.checked);const n=its.filter(i=>packed[i.id]).length;sh.querySelector("#tcnt").textContent=n;sh.querySelector("#tbar").style.width=(its.length?n/its.length*100:0)+"%"});
    sh.querySelector("#tedit").onclick=()=>{if(guardDemo())return;editTrip(JSON.parse(JSON.stringify(t)),false)};
    const del=sh.querySelector("#tdel");del.onclick=()=>{if(guardDemo())return;if(del.dataset.armed){remove("trips",id);closeSheet()}else{del.dataset.armed=1;del.textContent="Точно?"}};
  });
}

/* ---------- stylist ---------- */
const QUICK=["Образ в духе моего Пинтереста","Офис, +12°, дождь","Свидание вечером","Выходной, гуляем весь день","Что надеть из давно забытого?","Чего не хватает в моём гардеробе?","Капсула на 5 дней из того, что есть"];
function wardrobeContext(){
  const {items,plans}=V();
  const list=items.map(i=>({id:i.id,name:i.name,cat:CAT[i.cat],colors:i.colors,seasons:i.seasons,brand:i.brand||undefined,worn:i.wearCount||0,last:i.lastWorn||undefined}));
  const recent=plans.filter(p=>p.worn).sort((a,b)=>b.id<a.id?-1:1).slice(0,7).map(p=>({date:p.id,look:outfitById(p.outfitId)?.name}));
  return `Сегодня ${fmtDay(todayISO())} ${new Date().getFullYear()}, Киев.
Гардероб (JSON): ${JSON.stringify(list)}
Недавно надетое: ${JSON.stringify(recent)}${S.style?`
Её стиль по доске вдохновения в Pinterest: ${S.style.summary} Палитра: ${(S.style.palette||[]).map(c=>c.name).join(", ")}. Силуэты: ${(S.style.silhouettes||[]).join(", ")}. Ориентируйся на этот стиль, когда собираешь образы.`:""}`;
}
const SYS=`Ты — персональный стилист в приложении-гардеробе. Отвечай по-русски, коротко, конкретно, без комплиментов и восклицаний.
Правила: в образы ставь только вещи из гардероба, по их id. Образ — 2–6 вещей: либо платье, либо верх + низ; одна пара обуви; верхнюю одежду добавляй по погоде. Учитывай сезон и то, что надевалось недавно (не повторяй вчерашнее). Если для запроса не хватает вещей — прямо скажи, чего не хватает, и предложи лучшее из имеющегося.
Верни ТОЛЬКО JSON: {"reply":"2–4 предложения","outfits":[{"title":"короткое название","itemIds":["id",...],"why":"одно предложение"}]}. outfits может быть пустым, если вопрос не про образ.`;
function renderStylist(){
  const on=!!sampleFn;
  if(S.inspo===undefined){S.inspo=null;fetch("inspo.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.pins)&&j.pins.length){S.inspo=j.pins;S.inspoBoard=(j.resolved||"").replace(/^.*pinterest\.[a-z.]+\/[^/]+\//,"").replace(/\/.*$/,"");if(S.tab==="stylist")render()}}).catch(()=>{})}
  const pins=S.inspo||[],st=S.style;
  const thumb=u=>u.replace("/736x/","/236x/");
  const inspoHTML=pins.length?`<div class="field"><div class="spread"><span class="label">Вдохновение · Pinterest ${esc(S.inspoBoard||"")} · ${pins.length}</span>${on&&sampleFn.urls?`<button class="btn sm" id="anStyle" ${S.styleBusy?"disabled":""}>${S.styleBusy?`<span class="spinner"></span> Разбираю`:st?"Обновить стиль":"Разобрать мой стиль"}</button>`:""}</div>
      <div class="inspo">${pins.map((p,i)=>`<button data-pin="${i}" aria-label="Пин ${i+1}"><img src="${esc(thumb(p.img))}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join("")}</div></div>
    ${st?`<div class="stylecard"><span class="label">Твой стиль по Пинтересту</span><p>${esc(st.summary)}</p>
      ${(st.palette||[]).length?`<div class="pal">${st.palette.map(c=>`<span><i style="background:${esc(/^#[0-9a-f]{6}$/i.test(c.hex||"")?c.hex:"#ccc")}"></i>${esc(c.name)}</span>`).join("")}</div>`:""}
      ${(st.silhouettes||[]).length?`<div class="muted" style="font-size:14px">Силуэты: ${esc(st.silhouettes.join(", "))}</div>`:""}
      ${(st.missing||[]).length?`<div class="field"><span class="label">Чего не хватает до этих образов</span>${st.missing.map(m=>`<div style="font-size:14px"><b>${esc(m.name)}</b> <span class="muted">— ${esc(m.why)}</span></div>`).join("")}</div>`:""}</div>`:""}`:"";
  view.innerHTML=`${demoBanner()}${inspoHTML}
    ${on?"":`<div class="banner" style="border-style:solid"><span>Чтобы стилист заработал, добавь ключ API в настройках.</span><button class="btn sm primary" onclick="openSettings()">Настройки</button></div>`}
    <div class="chat" id="chat">${S.chat.length?"":`<div class="msg ai">Опиши повод и погоду — соберу образы из твоих вещей. Могу найти, чего не хватает, или помочь носить забытое.</div>`}${S.chat.map(m=>m.role==="user"?`<div class="msg me">${m.img?`<img src="${esc(m.img)}" alt="" referrerpolicy="no-referrer">`:""}${esc(m.text)}</div>`:aiMsg(m)).join("")}${S.busy?`<div class="msg ai"><span class="spinner"></span></div>`:""}</div>
    ${S.chat.length?"":`<div class="chips" style="flex-wrap:wrap">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}" ${on?"":"disabled"}>${esc(q)}</button>`).join("")}</div>`}
    <div class="composer"><textarea id="ci" rows="1" placeholder="Например: конференция, +8°, весь день на ногах" aria-label="Сообщение стилисту" ${on?"":"disabled"}></textarea><button class="btn primary" id="cs" ${on&&!S.busy?"":"disabled"} aria-label="Отправить">↑</button></div>
    ${S.chat.length?`<button class="btn ghost sm" id="cclr" style="align-self:center">Начать заново</button>`:""}`;
  const ci=view.querySelector("#ci");
  ci.oninput=()=>{ci.style.height="auto";ci.style.height=Math.min(140,ci.scrollHeight)+"px"};
  ci.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(ci.value)}};
  view.querySelector("#cs").onclick=()=>ask(ci.value);
  view.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(b.dataset.q));
  const cl=view.querySelector("#cclr");if(cl)cl.onclick=()=>{S.chat=[];lsSet("pr.chat",[]);render()};
  view.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>openPin(pins[+b.dataset.pin]));
  const an=view.querySelector("#anStyle");if(an)an.onclick=analyzeStyle;
  view.querySelectorAll("[data-saveo]").forEach(b=>b.onclick=()=>{if(guardDemo())return;const [mi,oi]=b.dataset.saveo.split(":").map(Number);const so=S.chat[mi].outfits[oi];
    save("outfits",{id:uid(),name:so.title||"Образ от стилиста",itemIds:so.itemIds,layout:null,bg:BOARD_BG[1],tags:["стилист"],createdAt:Date.now()}).then(ok=>{if(ok){so.saved=true;lsSet("pr.chat",S.chat);toast("Образ сохранён");render()}})});
  view.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>openItem(b.dataset.item));
  const last=view.querySelector("#chat").lastElementChild;if(last&&S.chat.length)last.scrollIntoView({block:"nearest"});
}
function aiMsg(m,mi){mi=S.chat.indexOf(m);
  (m.outfits||[]).forEach(o=>{o.itemIds=(o.itemIds||[]).filter(id=>itemById(id))});
  const cards=(m.outfits||[]).map((o,oi)=>o.itemIds.length?`<div class="ocard" style="padding:6px;background:var(--bg)">${boardHTML({itemIds:o.itemIds,bg:"var(--board)"},"mini")}<span class="nm">${esc(o.title||"")}</span>${o.why?`<span class="why">${esc(o.why)}</span>`:""}<button class="btn sm ${o.saved?"":"primary"}" data-saveo="${mi}:${oi}" ${o.saved?"disabled":""}>${o.saved?"Сохранено":"Сохранить"}</button></div>`:"").join("");
  return `<div class="msg ai">${esc(m.text)}${cards?`<div class="outs">${cards}</div>`:""}</div>`}
async function ask(q,extra={}){
  q=(q||"").trim();if(!q||S.busy)return;if(!sampleFn){openSettings();return}
  S.chat.push({role:"user",text:q,img:extra.img||undefined});S.busy=true;render();
  const msgs=[];S.chat.forEach((m,i)=>{if(m.role==="user")msgs.push({role:"user",content:(i===0?SYS+"\n\n"+wardrobeContext()+"\n\nЗапрос: ":"")+m.text});else msgs.push({role:"assistant",content:JSON.stringify({reply:m.text,outfits:m.outfits||[]})})});
  if(S.chat.length>1){msgs[msgs.length-1].content=wardrobeContext()+"\n\nЗапрос: "+q+"\n(Ответ — только JSON в том же формате.)"}
  try{const r=await sampleFn.json(msgs,{modelTier:"default",cache:false,imageUrls:extra.imageUrls});
    S.chat.push({role:"ai",text:(r&&r.reply)||"Готово.",outfits:Array.isArray(r&&r.outfits)?r.outfits.slice(0,4):[]});}
  catch(e){S.chat.push({role:"ai",text:errText(e),outfits:[]})}
  S.busy=false;S.chat=S.chat.slice(-30);lsSet("pr.chat",S.chat);if(S.tab==="stylist")render();
}

function openPin(p){if(!p)return;
  openSheet(`${hd("Пин")}<div class="preview" style="height:min(110vw,520px)"><img src="${esc(p.img)}" alt="" referrerpolicy="no-referrer"></div>
    ${p.title?`<div class="muted" style="font-size:14px">${esc(p.title)}</div>`:""}
    <div class="row"><button class="btn primary" id="pinLook" ${sampleFn&&sampleFn.urls?"":"disabled"}>Собрать похожее из моих вещей</button>${p.link?`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Открыть в Pinterest</a>`:""}</div>
    ${sampleFn&&sampleFn.urls?"":`<span class="muted" style="font-size:13px">Чтобы собирать образы по пинам, добавь ключ Anthropic в настройках.</span>`}`,sh=>{
    const b=sh.querySelector("#pinLook");if(b)b.onclick=()=>{closeSheet();ask("Собери из моих вещей образ как на этой картинке. Если точного аналога нет — ближайший и скажи, какой вещи не хватает.",{imageUrls:[p.img],img:p.img.replace("/736x/","/236x/")})}});
}
async function analyzeStyle(){
  if(!sampleFn||!sampleFn.urls||S.styleBusy||!S.inspo)return;
  S.styleBusy=true;render();
  const urls=S.inspo.slice(0,14).map(p=>p.img);
  const items=V().items.map(i=>`${i.name} (${CAT[i.cat]}, ${(i.colors||[]).join("/")})`).join("; ");
  try{const r=await sampleFn.json(`Это картинки с её доски вдохновения в Pinterest. Определи её стиль в одежде по ним. Учитывай только одежду, обувь и аксессуары; картинки не про одежду пропусти. Сравни с её гардеробом: ${items||"пока пуст"}.
Верни ТОЛЬКО JSON по-русски: {"summary":"2–3 предложения о стиле, конкретно, без комплиментов","palette":[{"name":"цвет","hex":"#RRGGBB"}],"silhouettes":["3–5 коротких описаний"],"missing":[{"name":"вещь","why":"зачем она для этого стиля, 1 короткая фраза"}]}. palette — 4–6 цветов, missing — 3–5 вещей, которых нет в гардеробе.`,{modelTier:"default",imageUrls:urls});
    if(r&&r.summary){S.style=r;lsSet("pr.style",r);toast("Стиль разобран")}}
  catch(e){toast(typeof errText==="function"?errText(e):"Не получилось разобрать стиль")}
  S.styleBusy=false;if(S.tab==="stylist")render();
}

boot();
</script>
</body>
</html>
